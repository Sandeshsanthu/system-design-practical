# FastAPI Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-app
  namespace: pdf-gen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pdf-app
  template:
    metadata:
      labels:
        app: pdf-app
    spec:
      serviceAccountName: pdf-worker-sa
      containers:
        - name: app
          image: sandeshs/pdf-generator:latest
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: db-secrets-sync, key: username }
            - name: DB_PASS
              valueFrom:
                secretKeyRef: { name: db-secrets-sync, key: password }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: db-secrets-sync, key: dbname }
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASS)@://amazonaws.com"
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "db-secret-provider"
---
# PDF Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-worker
  namespace: pdf-gen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pdf-worker
  template:
    metadata:
      labels:
        app: pdf-worker
    spec:
      serviceAccountName: pdf-worker-sa
      containers:
        - name: worker
          image: sandeshs/pdf-generator:latest
          command: [ "python", "-u", "worker.py" ]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: BUCKET_NAME
              value: "pdf-generator-sandesh"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: db-secrets-sync, key: username }
            - name: DB_PASS
              valueFrom:
                secretKeyRef: { name: db-secrets-sync, key: password }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: db-secrets-sync, key: dbname }
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASS)@://amazonaws.com"
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "db-secret-provider"
