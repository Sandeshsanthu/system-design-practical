# 1. The "Brain" Identity (Controller Role)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: karpenter
  namespace: kube-system
  annotations:
    # This is the "Manager" role that allows the pod to talk to AWS
    eks.amazonaws.com/role-arn: arn:aws:iam::667383782466:role/KarpenterController-eks-pdf-gen
---
# 2. The Scaling Rules
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot"]
        - key: "karpenter.k8s.aws/instance-category"
          operator: In
          values: ["t", "c", "m"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
# 3. The Infrastructure Map (Node Role)
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: "Karpenter-eks-pdf-gen-20260513075054144800000019"
  subnetSelectorTerms:
    - tags:
        # Use the discovery tag you added in the VPC module
        karpenter.sh/discovery: "eks-pdf-gen"
  securityGroupSelectorTerms:
    - tags:
        kubernetes.io/cluster/eks-pdf-gen: "owned"
  amiSelectorTerms:
    - alias: al2023@latest
