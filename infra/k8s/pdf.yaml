apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-app
  namespace: pdf-gen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf-app
  template:
    metadata:
      labels:
        app: pdf-app
    spec:
      # Using the merged ServiceAccount
      serviceAccountName: pdf-worker-sa
      containers:
        - name: app
          image: sandeshs/pdf-generator:fixed-v3
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: pdf-generator-env
          env:
            - name: REDIS_HOST        # <--- Add this
              value: "cache-headless" # <--- Add this
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pdf-app
  namespace: pdf-gen
spec:
  selector:
    app: pdf-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: LoadBalancer

