# Code Generated by Sidekick is for learning and experimentation purposes only.
deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
    storageClass: gp2

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

minio:
  enabled: false
