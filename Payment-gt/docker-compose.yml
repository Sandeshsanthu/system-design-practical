# filename: docker-compose.yml
# Code Generated by Sidekick is for learning and experimentation purposes only.

x-image-tag: &sha latest   # ← change to new SHA after CI push, or keep as latest

services:

  # ── INFRASTRUCTURE ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5432:5432"
    volumes:
      - pg_payment_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - payment-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - payment-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - payment-net
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # ── APPLICATION SERVICES ──────────────────────────────────────────────────

  auth-service:
    image: sandeshs/payment-gt-auth-service:6fdd18378fa55b0c7561aa970318e4d8cb2dc5b2
    container_name: auth-service
    ports:
      - "9000:9000"
    networks:
      - payment-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  # ✅ FIXED: image tag updated to latest after Dockerfile fix is pushed
  fraud-service:
    image: sandeshs/payment-gt-fraud-service:latest
    container_name: fraud-service
    ports:
      - "8004:8004"
    environment:
      DATABASE_URL: postgresql://payments:payments@postgres:5432/fraud_db
      PORT: "8004"
      LOW_RISK_THRESHOLD: "30"
      MEDIUM_RISK_THRESHOLD: "70"
      CARD_VELOCITY_WINDOW_MINUTES: "60"
      CARD_VELOCITY_MAX_ATTEMPTS: "5"
      IP_VELOCITY_WINDOW_MINUTES: "60"
      IP_VELOCITY_MAX_ATTEMPTS: "10"
      CUSTOMER_VELOCITY_WINDOW_HOURS: "24"
      CUSTOMER_VELOCITY_MAX_ATTEMPTS: "10"
      ML_MODEL_ENABLED: "true"
      ML_MODEL_WEIGHT: "0.3"
      RULES_WEIGHT: "0.7"
    networks:
      - payment-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  bank-connector:
    image: sandeshs/payment-gt-bank-connector:6fdd18378fa55b0c7561aa970318e4d8cb2dc5b2
    container_name: bank-connector
    ports:
      - "8006:8005"
    environment:
      DATABASE_URL: postgresql://payments:payments@postgres:5432/bank_connector_db
      PORT: "8005"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      STRIPE_API_VERSION: "2024-06-20"
      MAX_RETRIES: "3"
      RETRY_WAIT_SECONDS: "1.0"
      RETRY_MAX_WAIT_SECONDS: "10.0"
      CB_FAILURE_THRESHOLD: "5"
      CB_TIMEOUT_SECONDS: "60"
      STRIPE_TIMEOUT_SECONDS: "30"
    networks:
      - payment-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  ledger-service:
    image: sandeshs/payment-gt-ledger-service:6fdd18378fa55b0c7561aa970318e4d8cb2dc5b2
    container_name: ledger-service
    ports:
      - "8007:8007"
    environment:
      DATABASE_URL: postgresql://payments:payments@postgres:5432/ledger_db
      PORT: "8007"
      PLATFORM_FEE_PERCENT: "2.5"
      PLATFORM_ACCOUNT_ID: acc_platform
      ESCROW_ACCOUNT_ID: acc_escrow
      FEE_ACCOUNT_ID: acc_fees
      REFUND_RESERVE_ACCOUNT_ID: acc_refund_reserve
    networks:
      - payment-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8007/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  notification-service:
    image: sandeshs/payment-gt-notification-service:6fdd18378fa55b0c7561aa970318e4d8cb2dc5b2
    container_name: notification-service
    ports:
      - "8008:8008"
    environment:
      DATABASE_URL: postgresql://payments:payments@postgres:5432/notification_db
      PORT: "8008"
      MOCK_EMAIL: "true"
      MOCK_SMS: "true"
      WEBHOOK_SIGNING_SECRET: whsec_dev_secret_32_chars_minimum_x
      WEBHOOK_TIMEOUT_SECONDS: "10"
      WEBHOOK_MAX_RETRIES: "3"
    networks:
      - payment-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8008/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  payment-service:
    image: sandeshs/payment-gt-payment-service:4b3d27090652feda1212c7525c3f2267a861c0bb
    container_name: payment-service
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql://payments:payments@postgres:5432/payment_db
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX_PREFIX: payment-gt
      FRAUD_SERVICE_URL: http://fraud-service:8004
      BANK_CONNECTOR_URL: http://bank-connector:8005
      LEDGER_SERVICE_URL: http://ledger-service:8007
      NOTIFICATION_SERVICE_URL: http://notification-service:8008
      PORT: "8003"
    networks:
      - payment-net
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      fraud-service:
        condition: service_healthy
      bank-connector:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  merchant-service:
    image: sandeshs/payment-gt-merchant-service:6fdd18378fa55b0c7561aa970318e4d8cb2dc5b2
    container_name: merchant-service
    ports:
      - "8001:8001"
    environment:
      PAYMENT_ENGINE_URL: http://payment-service:8003
      PORT: "8001"
    networks:
      - payment-net
    depends_on:
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  customer-service:
    image: sandeshs/payment-gt-customer-service:6fdd18378fa55b0c7561aa970318e4d8cb2dc5b2
    container_name: customer-service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://payments:payments@postgres:5432/customer_db
      MERCHANT_SERVICE_URL: http://merchant-service:8001
      CHECKOUT_SESSION_TTL_MINUTES: "30"
      PAYMENT_METHOD_TTL_MINUTES: "15"
      PORT: "8002"
    networks:
      - payment-net
    depends_on:
      postgres:
        condition: service_healthy
      merchant-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    image: sandeshs/payment-gt-gateway:6fdd18378fa55b0c7561aa970318e4d8cb2dc5b2
    container_name: gateway
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://payments:payments@postgres:5432/gateway_db
      REDIS_URL: redis://redis:6379/0
      MERCHANT_SERVICE_URL: http://merchant-service:8001
      CUSTOMER_SERVICE_URL: http://customer-service:8002
      AUTH_SERVICE_URL: http://auth-service:9000
    ports:
      - "8080:8080"
    networks:
      - payment-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      fraud-service:
        condition: service_healthy
      bank-connector:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      merchant-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  reconciliation-service:
    image: sandeshs/payment-gt-reconciliation-service:6fdd18378fa55b0c7561aa970318e4d8cb2dc5b2
    container_name: reconciliation-service
    ports:
      - "8009:8009"
    environment:
      GATEWAY_URL: http://gateway:8080
      LEDGER_URL: http://ledger-service:8007
      BANK_URL: http://bank-connector:8005
      MERCHANT_URL: http://merchant-service:8001
      NOTIFICATION_URL: http://notification-service:8008
      SECRET_KEY: sk_test_123
      EOD_HOUR: "23"
      EOD_MINUTE: "0"
      EOD_TIMEZONE: America/New_York
      RECON_LIMIT: "500"
      PORT: "8009"
    networks:
      - payment-net
    depends_on:
      gateway:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      bank-connector:
        condition: service_healthy
      merchant-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8009/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pg_payment_data:
  elasticsearch_data:

networks:
  payment-net:
    driver: bridge
