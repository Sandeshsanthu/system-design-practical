# Code Generated by Sidekick is for learning and experimentation purposes only.
# filename: docker-compose.yml
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20


  auth-service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  merchant-service:
    build:
      context: .
      dockerfile: merchant_service/Dockerfile
    ports:
      - "8001:8001"

  customer-service:
    build:
      context: .
      dockerfile: customer_service/Dockerfile
    ports:
      - "8002:8002"

  gateway:
    build:
      context: .
      dockerfile: api-gatway/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "8080:8080"


