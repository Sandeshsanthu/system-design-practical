# Code Generated by Sidekick is for learning and experimentation purposes only.
# filename: docker-compose.yml

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5432:5432"
    volumes:
      - pg_payment_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - payment-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - payment-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth-service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    container_name: auth-service
    ports:
      - "9000:9000"
    networks:
      - payment-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  fraud-service:
    build:
      context: .
      dockerfile: fraud_service/Dockerfile
    container_name: fraud-service
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql://payments:payments@postgres:5432/fraud_db
      - PORT=8004
      - LOW_RISK_THRESHOLD=30
      - MEDIUM_RISK_THRESHOLD=70
      - CARD_VELOCITY_WINDOW_MINUTES=60
      - CARD_VELOCITY_MAX_ATTEMPTS=5
      - IP_VELOCITY_WINDOW_MINUTES=60
      - IP_VELOCITY_MAX_ATTEMPTS=10
      - CUSTOMER_VELOCITY_WINDOW_HOURS=24
      - CUSTOMER_VELOCITY_MAX_ATTEMPTS=10
      - ML_MODEL_ENABLED=true
      - ML_MODEL_WEIGHT=0.3
      - RULES_WEIGHT=0.7
    networks:
      - payment-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  payment-service:
    build:
      context: .
      dockerfile: Payment/Dockerfile
    container_name: payment-service
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://payments:payments@postgres:5432/payment_db
      - FRAUD_SERVICE_URL=http://fraud-service:8004
      - PORT=8003
    networks:
      - payment-net
    depends_on:
      postgres:
        condition: service_healthy
      fraud-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  merchant-service:
    build:
      context: .
      dockerfile: merchant_service/Dockerfile
    container_name: merchant-service
    ports:
      - "8001:8001"
    environment:
      - PAYMENT_ENGINE_URL=http://payment-service:8003
      - PORT=8001
    networks:
      - payment-net
    depends_on:
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  customer-service:
    build:
      context: .
      dockerfile: customer_service/Dockerfile
    container_name: customer-service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://payments:payments@postgres:5432/customer_db
      - MERCHANT_SERVICE_URL=http://merchant-service:8001
      - CHECKOUT_SESSION_TTL_MINUTES=30
      - PAYMENT_METHOD_TTL_MINUTES=15
      - PORT=8002
    networks:
      - payment-net
    depends_on:
      postgres:
        condition: service_healthy
      merchant-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: .
      dockerfile: api-gatway/Dockerfile
    container_name: api-gateway
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://payments:payments@postgres:5432/gateway_db
      - REDIS_URL=redis://redis:6379/0
      - MERCHANT_SERVICE_URL=http://merchant-service:8001
      - CUSTOMER_SERVICE_URL=http://customer-service:8002
      - AUTH_SERVICE_URL=http://auth-service:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      fraud-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      merchant-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - payment-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg_payment_data:

networks:
  payment-net:
    driver: bridge
