# filename: rds-sample-app.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: rds-test-script
  namespace: default
data:
  test_rds.py: |
    import boto3, json, psycopg2, sys, os

    REGION      = "us-east-2"
    SECRET_NAME = os.environ["SECRET_NAME"]

    print(f"[1/3] Fetching secret '{SECRET_NAME}' from Secrets Manager via IRSA...")
    client = boto3.client("secretsmanager", region_name=REGION)
    secret = json.loads(
        client.get_secret_value(SecretId=SECRET_NAME)["SecretString"]
    )
    print(f"      Secret keys found: {list(secret.keys())}")

    db_user = secret["username"]
    db_pass = secret["password"]
    db_name = secret["db_name"]
    db_host = secret["host"]
    db_port = int(secret["port"])

    print(f"[2/3] Connecting to PostgreSQL at {db_host}:{db_port}, db='{db_name}', user='{db_user}'...")
    try:
        conn = psycopg2.connect(
            host=db_host,
            port=db_port,
            dbname=db_name,
            user=db_user,
            password=db_pass,
            connect_timeout=10,
            sslmode="require"
        )
        cur = conn.cursor()

        print("[3/3] Running test queries...")
        cur.execute("SELECT version();")
        print(f"      PostgreSQL version : {cur.fetchone()[0]}")

        cur.execute("SELECT current_database(), current_user, now();")
        row = cur.fetchone()
        print(f"      Database           : {row[0]}")
        print(f"      Connected as       : {row[1]}")
        print(f"      Server time        : {row[2]}")

        cur.execute("""
            CREATE TABLE IF NOT EXISTS connection_test (
                id      SERIAL PRIMARY KEY,
                message TEXT,
                created TIMESTAMP DEFAULT now()
            );
        """)
        cur.execute("INSERT INTO connection_test (message) VALUES ('Hello from EKS via IRSA!');")
        conn.commit()

        cur.execute("SELECT id, message, created FROM connection_test ORDER BY id DESC LIMIT 3;")
        print("\n      Last 3 rows in connection_test:")
        for r in cur.fetchall():
            print(f"        {r}")

        cur.close()
        conn.close()
        print("\n✅  RDS connection test PASSED — IRSA + Secrets Manager + PostgreSQL all working!")
        sys.exit(0)

    except Exception as e:
        print(f"\n❌  Connection FAILED: {e}")
        sys.exit(1)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rds-connect-test
  namespace: default
  labels:
    app: rds-connect-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rds-connect-test
  template:
    metadata:
      labels:
        app: rds-connect-test
    spec:
      serviceAccountName: payment-api-sa
      containers:
      - name: rds-tester
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install --quiet boto3 psycopg2-binary && \
            python /scripts/test_rds.py
        env:
        - name: SECRET_NAME
          value: "production-core-eks-rds-secret"
        - name: AWS_REGION
          value: "us-east-2"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
      volumes:
      - name: script-volume
        configMap:
          name: rds-test-script
