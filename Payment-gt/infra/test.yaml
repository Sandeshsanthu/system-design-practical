apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: default
spec:
  replicas: 2
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      # Link the Service Account created by Terraform here
      serviceAccountName: payment-api-sa
      containers:
      - name: api-server
        image: your-registry/payment-api:v1
        env:
        # Pass the secret name as an environment variable so your code knows what to look up
        - name: AWS_SECRET_NAME
          value: "production-core-eks-rds-secret" 
