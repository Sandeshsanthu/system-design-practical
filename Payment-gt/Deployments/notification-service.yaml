apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service-stable
  namespace: payment-gt          # ← added
  labels:
    app: notification-service
    track: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notification-service
      track: stable
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: notification-service
        track: stable
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: notification-service
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: notification-service
      terminationGracePeriodSeconds: 45
      containers:
        - name: notification-service
          image: sandeshs/payment-gt-notification-service:90c8c62b87c2ddc4c8a8fbdaefd5434eb5268a97
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8008
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: notification-service-secret
                  key: database-url
            - name: WEBHOOK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: notification-service-secret
                  key: webhook-signing-secret
            - name: PORT
              value: "8008"
            - name: MOCK_EMAIL
              value: "true"
            - name: MOCK_SMS
              value: "true"
            - name: WEBHOOK_TIMEOUT_SECONDS
              value: "10"
            - name: WEBHOOK_MAX_RETRIES
              value: "3"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

