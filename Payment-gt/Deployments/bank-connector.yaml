apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-connector-stable
  namespace: payment-gt          # ← added
  labels:
    app: bank-connector
    track: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bank-connector
      track: stable
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bank-connector
        track: stable
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: bank-connector
      terminationGracePeriodSeconds: 45
      containers:
        - name: bank-connector
          image: sandeshs/payment-gt-bank-connector:90c8c62b87c2ddc4c8a8fbdaefd5434eb5268a97
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8005
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bank-connector-secret
                  key: database-url
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bank-connector-secret
                  key: stripe-secret-key
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: bank-connector-secret
                  key: stripe-webhook-secret
            - name: PORT
              value: "8005"
            - name: STRIPE_API_VERSION
              value: "2024-06-20"
            - name: MAX_RETRIES
              value: "3"
            - name: RETRY_WAIT_SECONDS
              value: "1.0"
            - name: RETRY_MAX_WAIT_SECONDS
              value: "10.0"
            - name: CB_FAILURE_THRESHOLD
              value: "5"
            - name: CB_TIMEOUT_SECONDS
              value: "60"
            - name: STRIPE_TIMEOUT_SECONDS
              value: "30"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

