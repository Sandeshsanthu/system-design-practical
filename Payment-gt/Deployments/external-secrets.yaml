# ── App secret ────────────────────────────────────────────────────────────────
# No urlQueryEscape — passwords are pre-encoded in SM at write time.
# DATABASE_URLs + REDIS_URL fetched from production-core-eks-app-urls.
# Static keys (Stripe, JWT, seeds) are inlined — replace with SM refs
# if rotation is needed in future.
#
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payment-gt-secret
  namespace: payment-gt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: payment-gt-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        # ── Static app secrets ─────────────────────────────────────────────
        STRIPE_SECRET_KEY:      ""
        STRIPE_WEBHOOK_SECRET:  "whsec_placeholder"
        KEY_HASH_PEPPER:        "replace-me-32-chars-minimum-xxxx"
        WEBHOOK_SIGNING_SECRET: "whsec_dev_secret_32_chars_minimum_x"
        SECRET_KEY:             "sk_test_123"
        SEED_API_KEYS_JSON: |
          [
            {"key_id":"mk_001","raw_key":"sk_test_123","merchant_id":"m_123","key_type":"secret",
             "scopes":["payment_intents:create","captures:create","refunds:create","voids:create","payments:read","balance:read"]},
            {"key_id":"pk_001","raw_key":"pk_test_123","merchant_id":"m_123","key_type":"publishable",
             "scopes":["payment_session:create","payment_method:tokenize","payment_intent:confirm_own","public_config:read"],
             "allowed_origins":["http://localhost:3000","https://shop.example.com"]}
          ]

        # ── Pre-encoded URLs — simple variable substitution, no functions ──
        BANK_CONNECTOR_DATABASE_URL: "{{ .BANK_CONNECTOR_DATABASE_URL }}"
        CUSTOMER_DATABASE_URL:       "{{ .CUSTOMER_DATABASE_URL }}"
        FRAUD_DATABASE_URL:          "{{ .FRAUD_DATABASE_URL }}"
        GATEWAY_DATABASE_URL:        "{{ .GATEWAY_DATABASE_URL }}"
        LEDGER_DATABASE_URL:         "{{ .LEDGER_DATABASE_URL }}"
        MERCHANT_DATABASE_URL:       "{{ .MERCHANT_DATABASE_URL }}"
        PAYMENT_DATABASE_URL:        "{{ .PAYMENT_DATABASE_URL }}"
        REDIS_URL:                   "{{ .REDIS_URL }}"

  data:
    - secretKey: BANK_CONNECTOR_DATABASE_URL
      remoteRef:
        key: production-core-eks-app-urls
        property: BANK_CONNECTOR_DATABASE_URL
    - secretKey: CUSTOMER_DATABASE_URL
      remoteRef:
        key: production-core-eks-app-urls
        property: CUSTOMER_DATABASE_URL
    - secretKey: FRAUD_DATABASE_URL
      remoteRef:
        key: production-core-eks-app-urls
        property: FRAUD_DATABASE_URL
    - secretKey: GATEWAY_DATABASE_URL
      remoteRef:
        key: production-core-eks-app-urls
        property: GATEWAY_DATABASE_URL
    - secretKey: LEDGER_DATABASE_URL
      remoteRef:
        key: production-core-eks-app-urls
        property: LEDGER_DATABASE_URL
    - secretKey: MERCHANT_DATABASE_URL
      remoteRef:
        key: production-core-eks-app-urls
        property: MERCHANT_DATABASE_URL
    - secretKey: PAYMENT_DATABASE_URL
      remoteRef:
        key: production-core-eks-app-urls
        property: PAYMENT_DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: production-core-eks-app-urls
        property: REDIS_URL
