---
apiVersion: v1
kind: Service
metadata:
  name: fraud-service
  namespace: payment-gt
spec:
  selector:
    app: fraud-service
  ports:
    - name: http
      port: 8004
      targetPort: http
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fraud-service-stable-hpa
  namespace: payment-gt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fraud-service-stable
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65     # scale earlier — ML is latency-sensitive
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fraud-service-pdb
  namespace: payment-gt
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: fraud-service
      track: stable
