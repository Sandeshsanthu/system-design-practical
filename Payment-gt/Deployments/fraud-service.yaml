      app: fraud-service
      track: canary
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: fraud-service
        track: canary
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: fraud-service
          image: sandeshs/payment-gt-fraud-service:90c8c62b87c2ddc4c8a8fbdaefd5434eb5268a97
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8004
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fraud-service-secret
                  key: database-url
            - name: PORT
              value: "8004"
            - name: ML_MODEL_ENABLED
              value: "true"
            - name: ML_MODEL_WEIGHT
              value: "0.3"
            - name: RULES_WEIGHT
              value: "0.7"
            - name: CANARY
              value: "true"
          resources:
