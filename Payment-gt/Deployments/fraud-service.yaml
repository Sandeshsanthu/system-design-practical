# filename: Payment-gt/Deployments/fraud-service.yaml
# Code Generated by Sidekick is for learning and experimentation purposes only.
# Higher CPU limit — ML model inference is compute-intensive

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-service-stable
  namespace: payment-gt
  labels:
    app: fraud-service
    track: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fraud-service
      track: stable
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: fraud-service
        track: stable
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: fraud-service
      terminationGracePeriodSeconds: 30
      containers:
        - name: fraud-service
          image: sandeshs/payment-gt-fraud-service:90c8c62b87c2ddc4c8a8fbdaefd5434eb5268a97
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8004
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fraud-service-secret
                  key: database-url
            - name: PORT
              value: "8004"
            - name: LOW_RISK_THRESHOLD
              value: "30"
            - name: MEDIUM_RISK_THRESHOLD
              value: "70"
            - name: CARD_VELOCITY_WINDOW_MINUTES
              value: "60"
            - name: CARD_VELOCITY_MAX_ATTEMPTS
              value: "5"
            - name: IP_VELOCITY_WINDOW_MINUTES
              value: "60"
            - name: IP_VELOCITY_MAX_ATTEMPTS
              value: "10"
            - name: CUSTOMER_VELOCITY_WINDOW_HOURS
              value: "24"
            - name: CUSTOMER_VELOCITY_MAX_ATTEMPTS
              value: "10"
            - name: ML_MODEL_ENABLED
              value: "true"
            - name: ML_MODEL_WEIGHT
              value: "0.3"
            - name: RULES_WEIGHT
              value: "0.7"
          resources:
            requests:
              cpu: 400m       # ML scoring needs more CPU
              memory: 512Mi
            limits:
              cpu: 800m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36   # ML model load can take longer — 3 min window
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-service-canary
  namespace: payment-gt
  labels:
