# filename: 09-gateway.yaml

apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: payment-gt
  labels:
    app: gateway-service
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/component: gateway
spec:
  selector:
    app: gateway-service
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: LoadBalancer

---

apiVersion: v1
kind: Service
metadata:
  name: gateway-service-canary
  namespace: payment-gt
  labels:
    app: gateway-service
    track: canary
spec:
  selector:
    app: gateway-service
    track: canary
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service-stable
  namespace: payment-gt
  labels:
    app: gateway-service
    track: stable
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/version: "609d4e9a23c36b8f609f342bed43c26e4e8a562f"
  annotations:
    kubernetes.io/change-cause: "stable — gateway-service 609d4e9a — secrets from SM"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
      track: stable
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: gateway-service
        track: stable
        version: "609d4e9a23c36b8f609f342bed43c26e4e8a562f"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gateway-service
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: gateway-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: gateway-service
          image: sandeshs/payment-gt-gateway:609d4e9a23c36b8f609f342bed43c26e4e8a562f
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: payment-gt-config
            - secretRef:
                name: payment-gt-secret       # injects REDIS_URL, KEY_HASH_PEPPER, STRIPE_*, etc.
          env:
            - name: PORT
              value: "8080"
            # DATABASE_URL — gateway_db connection URL, sourced from SM via ESO
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: payment-gt-secret
                  key: GATEWAY_DATABASE_URL
            # DB_PASSWORD — raw password for non-ORM usage, sourced from SM via ESO
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-gt-db-secret
                  key: payments_password
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 30
            successThreshold: 1
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 2
            timeoutSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]

---

