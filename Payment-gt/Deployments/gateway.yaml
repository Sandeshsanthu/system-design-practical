# filename: Payment-gt/Deployments/gateway.yaml
# Code Generated by Sidekick is for learning and experimentation purposes only.

# ─────────────────────────────────────────────────────────────────────────────
# 1. STABLE DEPLOYMENT (3 replicas — receives ~75% traffic)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-stable
  namespace: payment-gt          # ← added
  labels:
    app: gateway
    track: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway
      track: stable
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: gateway
        track: stable
        version: stable
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: gateway
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gateway
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: sandeshs/payment-gt-gateway:90c8c62b87c2ddc4c8a8fbdaefd5434eb5268a97
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-secret
                  key: database-url
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: MERCHANT_SERVICE_URL
              value: "http://merchant-service:8001"
            - name: CUSTOMER_SERVICE_URL
              value: "http://customer-service:8002"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:9000"
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

---
# ─────────────────────────────────────────────────────────────────────────────
# 2. CANARY DEPLOYMENT (1 replica — receives ~25% traffic)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-canary
  namespace: payment-gt          # ← added
  labels:
    app: gateway
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
      track: canary
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: gateway
        track: canary
        version: canary
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gateway
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: sandeshs/payment-gt-gateway:90c8c62b87c2ddc4c8a8fbdaefd5434eb5268a97
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-secret
                  key: database-url
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: MERCHANT_SERVICE_URL
              value: "http://merchant-service:8001"
            - name: CUSTOMER_SERVICE_URL
              value: "http://customer-service:8002"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:9000"
            - name: PORT
              value: "8080"
            - name: CANARY
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

---
# ─────────────────────────────────────────────────────────────────────────────
# 3. SERVICE — selector on `app: gateway` only, routes to BOTH stable + canary
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: payment-gt          # ← added
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP

---
# ─────────────────────────────────────────────────────────────────────────────
# 4. HPA — autoscales the STABLE deployment on CPU + memory
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-stable-hpa
  namespace: payment-gt          # ← added
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway-stable
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

---
# ─────────────────────────────────────────────────────────────────────────────
# 5. PodDisruptionBudget — guarantees ≥ 2 pods during node drain / upgrades
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  namespace: payment-gt          # ← added
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: gateway
      track: stable
