# filename: Payment-gt/Deployments/redis.yaml
# Code Generated by Sidekick is for learning and experimentation purposes only.
#
# ── Why StatefulSet for Redis? ────────────────────────────────────────────────
# Redis needs a stable PVC for RDB snapshots and AOF logs.
# Without it, every pod restart loses the rate-limit counters and session cache.
# StatefulSet gives redis-0 a permanent PVC that survives rescheduling.
# ─────────────────────────────────────────────────────────────────────────────

# ═════════════════════════════════════════════════════════════════════════════
# 7-A  PersistentVolumeClaim — 5Gi for RDB + AOF files
# ═════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: payment-gt                         # ← ADDED
  labels:
    app: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard    # ← replace: gp3 (AWS) / premium-rwo (GKE) / managed-csi (AKS)

---
# ═════════════════════════════════════════════════════════════════════════════
# 7-B  StatefulSet
# ═════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: payment-gt                         # ← ADDED
  labels:
    app: redis
spec:
  serviceName: redis-headless
  replicas: 1                   # single primary
                                # ↑ For HA: use Redis Sentinel (replicas: 3) or
                                #   Redis Cluster operator (redis-operator / spotahome)
  selector:
    matchLabels:
      app: redis

  updateStrategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: redis
    spec:
      # ── Scheduling ────────────────────────────────────────────────────
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: redis

      terminationGracePeriodSeconds: 30

      securityContext:
        fsGroup: 999            # redis UID inside the official image
        runAsUser: 999
        runAsNonRoot: true

      # ── Init container: fix PVC permissions ───────────────────────────
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 999:999 /data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false  # ← ADDED: overrides pod-level runAsNonRoot: true
                                 #   without this the init container crashes (same
                                 #   BackOff bug we hit on postgres)
          volumeMounts:
            - name: redis-data
              mountPath: /data

      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379

          # ── Load config file + inject password at runtime ──────────────
          command:
            - redis-server
            - /etc/redis/redis.conf
            - --requirepass
            - $(REDIS_PASSWORD)

          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD

          # ── Resource requests & limits ────────────────────────────────
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi       # maxmemory in redis.conf = 200MB (80% of this)

          # ── Startup probe ─────────────────────────────────────────────
          # Redis boots in <1s normally; 24 × 5s = 2 min safety window
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 24
            successThreshold: 1
            timeoutSeconds: 3

          # ── Liveness probe ────────────────────────────────────────────
          # Restart if redis stops responding to PING
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # ── Readiness probe ───────────────────────────────────────────
          # Remove from Service until redis is ready to serve traffic
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # ── Volume mounts ─────────────────────────────────────────────
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config
              mountPath: /etc/redis/redis.conf
              subPath: redis.conf
              readOnly: true

      # ── Volumes ────────────────────────────────────────────────────────
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
        - name: redis-config
          configMap:
            name: redis-config

---
# ═════════════════════════════════════════════════════════════════════════════
# 7-C  Headless Service — stable DNS for StatefulSet identity
# ═════════════════════════════════════════════════════════════════════════════
# Resolves to:  redis-0.redis-headless.payment-gt.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: payment-gt                         # ← ADDED
  labels:
    app: redis
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis

---
# ═════════════════════════════════════════════════════════════════════════════
# 7-D  ClusterIP Service — what gateway uses as REDIS_URL
# ═════════════════════════════════════════════════════════════════════════════
# REDIS_URL=redis://:<password>@redis.payment-gt.svc.cluster.local:6379/0
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: payment-gt                         # ← ADDED
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  type: ClusterIP

---
# ═════════════════════════════════════════════════════════════════════════════
# 7-E  PodDisruptionBudget
# ═════════════════════════════════════════════════════════════════════════════
# With replicas=1, maxUnavailable=0 blocks node drain until you approve.
# Prevents rate-limit state from being wiped mid-operation.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: payment-gt                         # ← ADDED
  labels:
    app: redis
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app: redis
