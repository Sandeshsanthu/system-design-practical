apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconciliation-service-stable
  namespace: payment-gt          # ← added
  labels:
    app: reconciliation-service
    track: stable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reconciliation-service
      track: stable
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: reconciliation-service
        track: stable
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: reconciliation-service
      terminationGracePeriodSeconds: 120
      containers:
        - name: reconciliation-service
          image: sandeshs/payment-gt-reconciliation-service:90c8c62b87c2ddc4c8a8fbdaefd5434eb5268a97
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8009
          env:
            - name: GATEWAY_URL
              value: "http://gateway:8080"
            - name: LEDGER_URL
              value: "http://ledger-service:8007"
            - name: BANK_URL
              value: "http://bank-connector:8005"
            - name: MERCHANT_URL
              value: "http://merchant-service:8001"
            - name: NOTIFICATION_URL
              value: "http://notification-service:8008"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: reconciliation-service-secret
                  key: secret-key
            - name: PORT
              value: "8009"
            - name: EOD_HOUR
              value: "23"
            - name: EOD_MINUTE
              value: "0"
            - name: EOD_TIMEZONE
              value: "America/New_York"
            - name: RECON_LIMIT
              value: "500"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 600m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

