---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reconciliation-service-stable-hpa
  namespace: payment-gt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reconciliation-service-stable
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600     # never evict during EOD run
      policies:
        - type: Pods
          value: 1
          periodSeconds: 180

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: reconciliation-service-pdb
  namespace: payment-gt
  labels:
    app: reconciliation-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: reconciliation-service
      track: stable

