# Code Generated by Sidekick is for learning and experimentation purposes only.

# filename: Payment-gt/Deployments/redis-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: payment-gt
data:
  redis.conf: |

    # ── Network ────────────────────────────────────────────────────────────
    bind 0.0.0.0
    port 6379
    protected-mode no

    # ── Persistence: RDB snapshots ─────────────────────────────────────────
    # save after 900s if at least 1 key changed
    save 900 1
    # save after 300s if at least 10 keys changed
    save 300 10
    # save after 60s if at least 10000 keys changed
    save 60 10000
    rdbcompression yes
    rdbchecksum yes
    dbfilename dump.rdb
    dir /data

    # ── Persistence: AOF ───────────────────────────────────────────────────
    # append-only log — survives crash between RDB snapshots
    appendonly yes
    appendfilename "appendonly.aof"
    # fsync every second — balance between safety and performance
    appendfsync everysec
    no-appendfsync-on-rewrite no

    # ── Memory management ──────────────────────────────────────────────────
    # 200mb = 80% of the 256Mi container limit
    maxmemory 200mb
    # evict least-recently-used keys when full
    maxmemory-policy allkeys-lru

    # ── Timeouts ───────────────────────────────────────────────────────────
    # close idle client connections after 300s
    timeout 300
    tcp-keepalive 60

    # ── Slow log ───────────────────────────────────────────────────────────
    # log commands slower than 10ms
    slowlog-log-slower-than 10000
    slowlog-max-len 128

    # ── Logging ────────────────────────────────────────────────────────────
    loglevel notice
    logfile ""

    # ── Disable dangerous commands ─────────────────────────────────────────
    rename-command FLUSHALL ""
    rename-command FLUSHDB  ""
    rename-command DEBUG    ""
    rename-command CONFIG   ""
