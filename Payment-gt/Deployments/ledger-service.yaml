# filename: Payment-gt/Deployments/ledger-service.yaml
# Code Generated by Sidekick is for learning and experimentation purposes only.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service-stable
  namespace: payment-gt          # ← added
  labels:
    app: ledger-service
    track: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ledger-service
      track: stable
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ledger-service
        track: stable
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: ledger-service
      terminationGracePeriodSeconds: 60
      containers:
        - name: ledger-service
          image: sandeshs/payment-gt-ledger-service:90c8c62b87c2ddc4c8a8fbdaefd5434eb5268a97
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8007
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ledger-service-secret
                  key: database-url
            - name: PORT
              value: "8007"
            - name: PLATFORM_FEE_PERCENT
              value: "2.5"
            - name: PLATFORM_ACCOUNT_ID
              value: "acc_platform"
            - name: ESCROW_ACCOUNT_ID
              value: "acc_escrow"
            - name: FEE_ACCOUNT_ID
              value: "acc_fees"
            - name: REFUND_RESERVE_ACCOUNT_ID
              value: "acc_refund_reserve"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

