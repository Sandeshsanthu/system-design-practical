apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service-stable
  namespace: payment-gt          # ← added
  labels:
    app: payment-service
    track: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-service
      track: stable
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: payment-service
        track: stable
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: payment-service
      terminationGracePeriodSeconds: 60
      containers:
        - name: payment-service
          image: sandeshs/payment-gt-payment-service:90c8c62b87c2ddc4c8a8fbdaefd5434eb5268a97
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8003
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: payment-service-secret
                  key: database-url
            - name: ELASTICSEARCH_URL
              value: "http://elasticsearch:9200"
            - name: ELASTICSEARCH_INDEX_PREFIX
              value: "payment-gt"
            - name: FRAUD_SERVICE_URL
              value: "http://fraud-service:8004"
            - name: BANK_CONNECTOR_URL
              value: "http://bank-connector:8005"
            - name: LEDGER_SERVICE_URL
              value: "http://ledger-service:8007"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8008"
            - name: PORT
              value: "8003"
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 600m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

