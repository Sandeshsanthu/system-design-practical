# filename: Payment-gt/Deployments/postgres-init-configmap.yaml
# Code Generated by Sidekick is for learning and experimentation purposes only.
#
# Mounted into /docker-entrypoint-initdb.d/
# PostgreSQL runs every *.sql file in that folder ONCE on first boot.
# Sourced directly from your init.sql file.

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: payment-gt  # <-- Explicitly targeting your namespace here
  labels:
    app: postgres
data:
  init-db.sql: |
    -- ── Create all service databases ─────────────────────────────────────
    CREATE DATABASE gateway_db;
    CREATE DATABASE customer_db;
    CREATE DATABASE payment_db;
    CREATE DATABASE fraud_db;
    CREATE DATABASE bank_connector_db;
    CREATE DATABASE ledger_db;
    CREATE DATABASE notification_db;

    -- ── Grant full privileges to the payments user ────────────────────────
    GRANT ALL PRIVILEGES ON DATABASE gateway_db        TO payments;
    GRANT ALL PRIVILEGES ON DATABASE customer_db       TO payments;
    GRANT ALL PRIVILEGES ON DATABASE payment_db        TO payments;
    GRANT ALL PRIVILEGES ON DATABASE fraud_db          TO payments;
    GRANT ALL PRIVILEGES ON DATABASE bank_connector_db TO payments;
    GRANT ALL PRIVILEGES ON DATABASE ledger_db         TO payments;
    GRANT ALL PRIVILEGES ON DATABASE notification_db   TO payments;
