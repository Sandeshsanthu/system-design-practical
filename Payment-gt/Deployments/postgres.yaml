# filename: Payment-gt/Deployments/postgres.yaml
# Code Generated by Sidekick is for learning and experimentation purposes only.

# ═════════════════════════════════════════════════════════════════════════════
# 4-A  PersistentVolumeClaim
# ═════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: payment-gt
  labels:
    app: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard

---
# ═════════════════════════════════════════════════════════════════════════════
# 4-B  StatefulSet
# ═════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: payment-gt
  labels:
    app: postgres
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0

  template:
    metadata:
      labels:
        app: postgres
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: postgres

      terminationGracePeriodSeconds: 60

      # Pod-level: postgres main container runs as UID 70
      securityContext:
        fsGroup: 70
        runAsUser: 70
        runAsNonRoot: true

      # ── Init container: fix PVC permissions before postgres starts ────────
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 70:70 /var/lib/postgresql/data"]
          securityContext:
            runAsUser: 0            # root — only for this init step
            runAsNonRoot: false     # ← ADDED: explicitly overrides pod-level runAsNonRoot: true
                                    #   Without this, Kubernetes rejects UID 0 even here
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: payments
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          args:
            - postgres
            - -c
            - config_file=/etc/postgresql/postgresql.conf

          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi

          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U payments -d payments
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
            successThreshold: 1
            timeoutSeconds: 3

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U payments -d payments
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U payments -d payments
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: postgres-config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
              readOnly: true

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-sql
          configMap:
            name: postgres-init-sql
        - name: postgres-config
          configMap:
            name: postgres-tuning-config

---
# ═════════════════════════════════════════════════════════════════════════════
# 4-C  Headless Service
# ═════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: payment-gt
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

---
# ═════════════════════════════════════════════════════════════════════════════
# 4-D  ClusterIP Service
# ═════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: payment-gt
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  type: ClusterIP

---
# ═════════════════════════════════════════════════════════════════════════════
# 4-E  PodDisruptionBudget
# ═════════════════════════════════════════════════════════════════════════════
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-pdb
  namespace: payment-gt
  labels:
    app: postgres
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app: postgres
