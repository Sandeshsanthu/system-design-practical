---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: merchant-service-hpa
  namespace: payment-gt
  labels:
    app: merchant-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: merchant-service-stable
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 45
      policies:
        - type: Pods
          value: 1
          periodSeconds: 45
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: merchant-service-pdb
  namespace: payment-gt
  labels:
    app: merchant-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: merchant-service
      track: stable

