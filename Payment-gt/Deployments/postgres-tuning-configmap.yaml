# filename: Payment-gt/Deployments/postgres-tuning-configmap.yaml
# Code Generated by Sidekick is for learning and experimentation purposes only.
#
# Tuned for resources.limits.memory = 2Gi
# Rule of thumb:
#   shared_buffers        = 25% of RAM  → 512MB
#   effective_cache_size  = 75% of RAM  → 1536MB
#   work_mem              = RAM / (max_connections * 2) → ~16MB

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-tuning-config
  namespace: payment-gt  # <-- Explicitly targeting your namespace here
  labels:
    app: postgres
data:
  postgresql.conf: |
    # ── Memory ────────────────────────────────────────────────────────────
    shared_buffers                = 512MB
    effective_cache_size          = 1536MB
    work_mem                      = 16MB
    maintenance_work_mem          = 128MB
    huge_pages                    = off

    # ── Connections ───────────────────────────────────────────────────────
    max_connections               = 200

    # ── WAL & Checkpoints ─────────────────────────────────────────────────
    wal_level                     = replica     # enables streaming replication later
    max_wal_size                  = 1GB
    min_wal_size                  = 80MB
    checkpoint_completion_target  = 0.9
    wal_buffers                   = 16MB

    # ── Query Planner ─────────────────────────────────────────────────────
    random_page_cost              = 1.1         # SSD-friendly
    effective_io_concurrency      = 200

    # ── Parallelism ───────────────────────────────────────────────────────
    max_worker_processes          = 4
    max_parallel_workers          = 4
    max_parallel_workers_per_gather = 2

    # ── Logging ───────────────────────────────────────────────────────────
    log_min_duration_statement    = 500         # log queries > 500ms
    log_checkpoints               = on
    log_lock_waits                = on
    log_temp_files                = 0
    log_connections               = off
    log_disconnections            = off
    log_line_prefix               = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

    # ── Timezone ──────────────────────────────────────────────────────────
    timezone                      = 'America/New_York'
    log_timezone                  = 'America/New_York'
