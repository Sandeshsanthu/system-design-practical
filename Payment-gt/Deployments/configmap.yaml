# filename: Payment-gt/Deployments/configmap.yaml
# Code Generated by Sidekick is for learning and experimentation purposes only.
# Non-sensitive config shared across services — sourced from .env

apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-gt-config
  namespace: payment-gt
data:
  # Service URLs
  MERCHANT_SERVICE_URL: "http://merchant-service:8001"
  CUSTOMER_SERVICE_URL: "http://customer-service:8002"
  PAYMENT_SERVICE_URL:  "http://payment-service:8003"
  AUTH_SERVICE_URL:     "http://auth-service:9000"

  # JWT (public endpoint — not secret)
  JWT_ISSUER:                       "http://auth-service:9000"
  JWT_AUDIENCE:                     "payments-api"
  JWKS_URL:                         "http://auth-service:9000/.well-known/jwks.json"
  JWKS_TTL_SECONDS:                 "3600"
  JWKS_REFRESH_COOLDOWN_SECONDS:    "300"

  # CORS
  PUBLIC_ALLOWED_ORIGINS: "http://localhost:3000"

  # Rate limiting
  MERCHANT_RATE_LIMIT_PER_MIN:        "300"
  PUBLIC_RATE_LIMIT_PER_MIN:          "60"
  PUBLIC_CONFIRM_RATE_LIMIT_PER_MIN:  "12"

  # Customer service
  CHECKOUT_SESSION_TTL_MINUTES: "30"
  PAYMENT_METHOD_TTL_MINUTES:   "15"

  # Stripe (non-secret)
  STRIPE_API_VERSION: "2024-06-20"

  # Reconciliation
  EOD_HOUR:     "23"
  EOD_MINUTE:   "0"
  EOD_TIMEZONE: "America/New_York"
  RECON_LIMIT:  "500"
