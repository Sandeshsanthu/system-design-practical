# filename: customer-service.yaml

apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: payment-gt
  labels:
    app: customer-service
spec:
  selector:
    app: customer-service
  ports:
    - name: http
      port: 8002
      targetPort: 8002
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: customer-service-canary
  namespace: payment-gt
  labels:
    app: customer-service
    track: canary
spec:
  selector:
    app: customer-service
    track: canary
  ports:
    - name: http
      port: 8002
      targetPort: 8002
  type: ClusterIP

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service-stable
  namespace: payment-gt
  labels:
    app: customer-service
    track: stable
  annotations:
    kubernetes.io/change-cause: "stable — customer-service 609d4e9a — secrets from SM"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
      track: stable
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: customer-service
        track: stable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: customer-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: customer-service
          image: sandeshs/payment-gt-customer-service:609d4e9a23c36b8f609f342bed43c26e4e8a562f
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: payment-gt-config
            - secretRef:
                name: payment-gt-secret     # injects REDIS_URL, STRIPE_*, KEY_HASH_PEPPER
          env:
            - name: PORT
              value: "8002"
            # Pre-encoded URL pulled from SM by ESO — no runtime construction
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: payment-gt-secret
                  key: CUSTOMER_DATABASE_URL
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-gt-db-secret
                  key: payments_password
          resources:
            requests:
              cpu: "75m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 2
            timeoutSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service-canary
  namespace: payment-gt
  labels:
    app: customer-service
    track: canary
  annotations:
    kubernetes.io/change-cause: "canary — customer-service 609d4e9a — secrets from SM"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
      track: canary
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: customer-service
        track: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
        - name: customer-service
          image: sandeshs/payment-gt-customer-service:609d4e9a23c36b8f609f342bed43c26e4e8a562f
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: payment-gt-config
            - secretRef:
                name: payment-gt-secret
          env:
            - name: PORT
              value: "8002"
            - name: CANARY
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: payment-gt-secret
                  key: CUSTOMER_DATABASE_URL
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-gt-db-secret
                  key: payments_password
          resources:
            requests:
              cpu: "75m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 2
            timeoutSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customer-service-hpa
  namespace: payment-gt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customer-service-stable
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 45
      policies:
        - type: Pods
          value: 1
          periodSeconds: 45
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: customer-service-pdb
  namespace: payment-gt
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: customer-service
      track: stable

