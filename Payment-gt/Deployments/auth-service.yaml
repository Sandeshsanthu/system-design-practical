apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-stable
  namespace: payment-gt          # ← added
  labels:
    app: auth-service
    track: stable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
      track: stable
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: auth-service
        track: stable
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: auth-service
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth-service
          image: sandeshs/payment-gt-auth-service:90c8c62b87c2ddc4c8a8fbdaefd5434eb5268a97
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: PORT
              value: "9000"
          envFrom:
            - secretRef:
                name: auth-service-secret   # ← wires DATABASE_URL + KEY_HASH_PEPPER
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

