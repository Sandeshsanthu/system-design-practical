# Code Generated by Sidekick is for learning and experimentation purposes only.
# filename: .github/workflows/docker-ci.yml
name: Build, Test, and Push

on:
  push:
    branches:
      - main
    paths:
      - "booking-system/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: booking-system-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  APP_DIR: booking-system
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/booking-system

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            booking-system/requirements.txt
            booking-system/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff

      - name: Run lint
        working-directory: ${{ env.APP_DIR }}
        run: ruff check .

  security-scan:
    name: Secret Guardrail Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.28.0 # Fixed: Added the required 'v' prefix
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            booking-system/requirements.txt
            booking-system/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-asyncio pytest-cov requests

      - name: Run unit tests
        working-directory: ${{ env.APP_DIR }}
        env:
          ENVIRONMENT: test
          PAYMENT_GATEWAY_MODE: mock
        run: |
          if [ -d tests/unit ]; then
            pytest tests/unit -q --maxfail=1
          elif [ -d tests ]; then
            pytest tests -q --maxfail=1 -m "not integration"
          else
            echo "No unit tests found. Skipping."
          fi

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: booking_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            booking-system/requirements.txt
            booking-system/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-asyncio pytest-cov psycopg2-binary redis requests

      - name: Run integration tests
        working-directory: ${{ env.APP_DIR }}
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_test
          REDIS_URL: redis://localhost:6379/0
          PAYMENT_GATEWAY_MODE: mock
        run: |
          if [ -d tests/integration ]; then
            pytest tests/integration -q --maxfail=1
          elif [ -d tests ]; then
            pytest tests -q --maxfail=1 -m "integration"
          else
            echo "No integration tests found. Skipping."
          fi

  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: booking_migration
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_migration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            booking-system/requirements.txt
            booking-system/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install alembic psycopg2-binary

      - name: Run Alembic if available
        working-directory: ${{ env.APP_DIR }}
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_migration
        run: |
          if [ -f alembic.ini ]; then
            alembic -c alembic.ini upgrade head
            alembic -c alembic.ini current
          else
            echo "alembic.ini not found. Skipping migration check."
          fi

  docker-build-push:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - lint
      - security-scan
      - unit-tests
      - integration-tests
      - migration-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Dockerfile exists
        id: dockerfile_check
        run: |
          if [ -f "${{ env.APP_DIR }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.dockerfile_check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.dockerfile_check.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        if: steps.dockerfile_check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./booking-system
          file: ./booking-system/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip Docker steps
        if: steps.dockerfile_check.outputs.exists != 'true'
        run: echo "Dockerfile not found. Skipping Docker build and push."
