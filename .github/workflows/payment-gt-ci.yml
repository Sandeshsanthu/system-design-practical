# filename: .github/workflows/payment-gt-ci.yml
# Code Generated by Sidekick is for learning and experimentation purposes only.

name: Payment-GT Build, Test, and Push

on:
  push:
    branches:
      - main
    paths:
      - "Payment-gt/**"
      - ".github/workflows/payment-gt-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payment-gt-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  APP_DIR: Payment-gt
  REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:

  # ── 1. LINT ──────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            Payment-gt/requirements.txt
            Payment-gt/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt
          [ -f requirements-dev.txt ] && pip install -r requirements-dev.txt
          pip install ruff

      - name: Run ruff
        working-directory: ${{ env.APP_DIR }}
        run: |
          # FIX 1: auto-fix all [*] fixable errors first, THEN assert clean
          ruff check . --fix --unsafe-fixes
          ruff check .

  # ── 2. SECRET SCAN ───────────────────────────
  security-scan:
    name: Secret Guardrail Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve base SHA
        id: base
        run: |
          # FIX 2: github.event.before is empty on workflow_dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.sha }}^" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ steps.base.outputs.sha }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  # ── 3. UNIT TESTS ────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            Payment-gt/requirements.txt
            Payment-gt/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt
          [ -f requirements-dev.txt ] && pip install -r requirements-dev.txt
          pip install pytest pytest-asyncio pytest-cov requests

      - name: Run unit tests
        working-directory: ${{ env.APP_DIR }}
        env:
          ENVIRONMENT: test
          PAYMENT_GATEWAY_MODE: mock
        run: |
          if [ -d tests/unit ]; then
            pytest tests/unit -q --maxfail=1
          elif [ -d tests ]; then
            pytest tests -q --maxfail=1 -m "not integration"
          else
            echo "No unit tests found. Skipping."
          fi

  # ── 4. INTEGRATION TESTS ─────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: payment_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d payment_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            Payment-gt/requirements.txt
            Payment-gt/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt
          [ -f requirements-dev.txt ] && pip install -r requirements-dev.txt
          pip install pytest pytest-asyncio pytest-cov psycopg2-binary redis requests elasticsearch

      - name: Run integration tests
        working-directory: ${{ env.APP_DIR }}
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payment_test
          REDIS_URL: redis://localhost:6379/0
          ELASTICSEARCH_URL: http://localhost:9200
          PAYMENT_GATEWAY_MODE: mock
        run: |
          if [ -d tests/integration ]; then
            pytest tests/integration -q --maxfail=1
          elif [ -d tests ]; then
            pytest tests -q --maxfail=1 -m "integration"
          else
            echo "No integration tests found. Skipping."
          fi

  # ── 5. MIGRATION CHECK ───────────────────────
  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: payment_migration
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d payment_migration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            Payment-gt/requirements.txt
            Payment-gt/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt
          pip install alembic psycopg2-binary

      - name: Run Alembic migrations
        working-directory: ${{ env.APP_DIR }}
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payment_migration
        run: |
          if [ -f alembic.ini ]; then
            alembic -c alembic.ini upgrade head
            alembic -c alembic.ini current
          else
            echo "alembic.ini not found. Skipping migration check."
          fi

  # ── 6. DOCKER BUILD + PUSH (matrix) ──────────
  docker-build-push:
    name: Docker – ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - lint
      - security-scan
      - unit-tests
      - integration-tests
      - migration-check

    strategy:
      fail-fast: false
      # FIX 3: matrix now carries THREE fields per service:
      #   service  → image-tag suffix  (always hyphenated, no underscores)
      #   folder   → real folder name on disk (may use underscores or have a typo)
      #   ctx      → build context path relative to repo root
      #   file     → Dockerfile path relative to repo root
      # This decouples image naming from folder naming completely.
      matrix:
        include:
          # service name (tag)      | disk folder        | build context                     | dockerfile path
          - service: gateway
            folder:  api-gatway                           # ← typo preserved to match repo
            ctx:     Payment-gt/api-gatway
            file:    Payment-gt/api-gatway/Dockerfile

          - service: auth-service
            folder:  auth_service
            ctx:     Payment-gt/auth_service
            file:    Payment-gt/auth_service/Dockerfile

          - service: customer-service
            folder:  customer_service
            ctx:     Payment-gt/customer_service
            file:    Payment-gt/customer_service/Dockerfile

          - service: merchant-service
            folder:  merchant_service
            ctx:     Payment-gt/merchant_service
            file:    Payment-gt/merchant_service/Dockerfile

          - service: payment-service
            folder:  payment                              # ← non-standard: Dockerfile lives in Payment/
            ctx:     Payment-gt/payment                          # ← context is project root so COPY paths work
            file:    Payment-gt/payment/Dockerfile

          - service: fraud-service
            folder:  fraud_service
            ctx:     Payment-gt/fraud_service
            file:    Payment-gt/fraud_service/Dockerfile

          - service: bank-connector
            folder:  bank_connector
            ctx:     Payment-gt/bank_connector
            file:    Payment-gt/bank_connector/Dockerfile

          - service: ledger-service
            folder:  ledger_service
            ctx:     Payment-gt/ledger_service
            file:    Payment-gt/ledger_service/Dockerfile

          - service: notification-service
            folder:  notification-service
            ctx:     Payment-gt/notification-service
            file:    Payment-gt/notification-service/Dockerfile

          - service: reconciliation-service
            folder:  reconciliation_service
            ctx:     Payment-gt/reconciliation_service
            file:    Payment-gt/reconciliation_service/Dockerfile

    steps:
      - uses: actions/checkout@v4

      # FIX 4: check the REAL file path from matrix.file, not a guessed path
      - name: Check Dockerfile exists
        id: df_check
        run: |
          if [ -f "${{ matrix.file }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  No Dockerfile found for ${{ matrix.service }} at ${{ matrix.file }} – skipping."
          fi

      - name: Set up Docker Buildx
        if: steps.df_check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.df_check.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        if: steps.df_check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.ctx }}           # ← uses explicit ctx from matrix
          file:    ${{ matrix.file }}           # ← uses explicit file from matrix
          push: true
          tags: |
            ${{ env.REGISTRY_USER }}/payment-gt-${{ matrix.service }}:latest
            ${{ env.REGISTRY_USER }}/payment-gt-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.service }}

  # ── 7. UPDATE K8s MANIFESTS ──────────────────
  update-k8s-manifests:
    name: Update K8s Manifests
    needs: docker-build-push
    runs-on: ubuntu-latest
    # FIX 5: job-level write overrides workflow-level read for git push
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # FIX 6: pin kustomize version — raw install script fetches "latest"
      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.1"

      # FIX 7: all image names now use hyphens consistently — matches what
      # docker-build-push actually tagged and pushed above
      - name: Update all service image tags
        run: |
          cd Payment-gt/Deployments
          kustomize edit set image \
            ${{ env.REGISTRY_USER }}/payment-gt-gateway=${{ env.REGISTRY_USER }}/payment-gt-gateway:${{ github.sha }} \
            ${{ env.REGISTRY_USER }}/payment-gt-auth-service=${{ env.REGISTRY_USER }}/payment-gt-auth-service:${{ github.sha }} \
            ${{ env.REGISTRY_USER }}/payment-gt-customer-service=${{ env.REGISTRY_USER }}/payment-gt-customer-service:${{ github.sha }} \
            ${{ env.REGISTRY_USER }}/payment-gt-merchant-service=${{ env.REGISTRY_USER }}/payment-gt-merchant-service:${{ github.sha }} \
            ${{ env.REGISTRY_USER }}/payment-gt-payment-service=${{ env.REGISTRY_USER }}/payment-gt-payment-service:${{ github.sha }} \
            ${{ env.REGISTRY_USER }}/payment-gt-fraud-service=${{ env.REGISTRY_USER }}/payment-gt-fraud-service:${{ github.sha }} \
            ${{ env.REGISTRY_USER }}/payment-gt-bank-connector=${{ env.REGISTRY_USER }}/payment-gt-bank-connector:${{ github.sha }} \
            ${{ env.REGISTRY_USER }}/payment-gt-ledger-service=${{ env.REGISTRY_USER }}/payment-gt-ledger-service:${{ github.sha }} \
            ${{ env.REGISTRY_USER }}/payment-gt-notification-service=${{ env.REGISTRY_USER }}/payment-gt-notification-service:${{ github.sha }} \
            ${{ env.REGISTRY_USER }}/payment-gt-reconciliation-service=${{ env.REGISTRY_USER }}/payment-gt-reconciliation-service:${{ github.sha }}

      - name: Commit and push manifest changes
        run: |
          git config --global user.name "GitOps Bot"
          git config --global user.email "gitops-bot@github.com"
          git add Payment-gt/Deployments/kustomization.yaml

          if git diff --staged --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "Deploy payment-gt ${GITHUB_SHA:0:7} [skip ci]"
            git push
          fi
