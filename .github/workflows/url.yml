# filename: build-and-deploy.yml
name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]
    paths:
      - 'URl-Shortner/**'

permissions:
  contents: write
  packages: write

jobs:
  # JOB 1: Scan for secrets before doing anything
  security-scan:
    name: Secret Guardrail Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  # JOB 2: Build and Push in Parallel using a Strategy Matrix
  build-and-push:
    name: Docker Build & Push
    needs: security-scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service_name: url-shortener-write-service
            context_path: ./URl-Shortner/services/write_service
            dockerfile_path: ./URl-Shortner/services/write_service/Dockerfile
          - service_name: url-shortener-redirect-service
            context_path: ./URl-Shortner/services/redirect_service
            dockerfile_path: ./URl-Shortner/services/redirect_service/Dockerfile
          - service_name: url-shortener-analytics-worker
            context_path: ./URl-Shortner/services/analytics_worker
            dockerfile_path: ./URl-Shortner/services/analytics_worker/Dockerfile
          - service_name: url-shortener-nginx-cdn
            context_path: ./URl-Shortner/nginx
            dockerfile_path: ./URl-Shortner/nginx/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Microservice
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context_path }}
          file: ${{ matrix.dockerfile_path }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service_name }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # JOB 3: Update Kubernetes manifests with new image tags
  update-k8s-manifests:
    name: Update K8s Manifests
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update image tags
        run: |
          cd URl-Shortner/deployment
          
          echo "Before update:"
          grep "newTag:" kustomization.yaml
          
          # Update all service images with commit SHA
          kustomize edit set image \
            sandeshs/url-shortener-write-service=sandeshs/url-shortener-write-service:${{ github.sha }} \
            sandeshs/url-shortener-redirect-service=sandeshs/url-shortener-redirect-service:${{ github.sha }} \
            sandeshs/url-shortener-analytics-worker=sandeshs/url-shortener-analytics-worker:${{ github.sha }} \
            sandeshs/url-shortener-nginx-cdn=sandeshs/url-shortener-nginx-cdn:${{ github.sha }}
          
          echo "After update:"
          grep "newTag:" kustomization.yaml

      - name: Commit and Push
        run: |
          git config --global user.name "GitOps Bot"
          git config --global user.email "gitops-bot@github.com"
          git add URl-Shortner/deployment/kustomization.yaml
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🚀 Deploy: ${GITHUB_SHA:0:7} [skip ci]"
            git push
            echo "Successfully pushed changes!"
          fi
