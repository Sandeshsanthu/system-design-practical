# Code Generated by Sidekick is for learning and experimentation purposes only.
name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]
    paths:
      - 'URl-Shortner/**' # Matches your case-sensitive folder name

jobs:
  # GUARDRAIL 1: Scan for secrets before doing anything
  security-scan:
    name: Secret Guardrail Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  # JOB 2: Build and Push in Parallel using a Strategy Matrix
  build-and-push:
    name: Docker Build & Push
    needs: security-scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service_name: url-shortener-write-service
            context_path: ./URl-Shortner/services/write_service
            dockerfile_path: ./URl-Shortner/services/write_service/Dockerfile
          - service_name: url-shortener-redirect-service
            context_path: ./URl-Shortner/services/redirect_service
            dockerfile_path: ./URl-Shortner/services/redirect_service/Dockerfile
          - service_name: url-shortener-analytics-worker
            context_path: ./URl-Shortner/services/analytics_worker
            dockerfile_path: ./URl-Shortner/services/analytics_worker/Dockerfile
          # FIXED: Unified matrix keys and set context to subfolder to expose both nginx and frontend folders
          - service_name: url-shortener-nginx-cdn
            context_path: ./URl-Shortner/nginx
            dockerfile_path: ./URl-Shortner/nginx/Dockerfile


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # FIXED: Uses unified context_path and dockerfile_path keys across all matrix items
      - name: Build and Push Microservice
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context_path }}
          file: ${{ matrix.dockerfile_path }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service_name }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
