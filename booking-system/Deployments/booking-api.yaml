  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-api
  namespace: booking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: booking-api
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: booking-api
      containers:
        - name: booking-api
          image: sandeshs/booking-system:dd228d899b605ea405444c4409d8689eab944aa5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PYTHONPATH
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: PYTHONPATH
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: booking-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: booking-secrets
                  key: REDIS_URL
            - name: PAYMENT_GATEWAY_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: PAYMENT_GATEWAY_BASE_URL
            - name: PAYMENT_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: booking-secrets
                  key: PAYMENT_GATEWAY_API_KEY
            - name: HOLD_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: HOLD_TTL_SECONDS
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: LOG_LEVEL
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: DEBUG
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
          startupProbe:
            tcpSocket:
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
