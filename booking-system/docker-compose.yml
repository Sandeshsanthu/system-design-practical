services:
  postgres:
    image: postgres:15-alpine
    container_name: booking-postgres
    environment:
      POSTGRES_DB: bookingdb
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_user -d bookingdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - booking-network

  redis:
    image: redis:7-alpine
    container_name: booking-redis
    command: redis-server --requirepass redis_password
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - booking-network

  booking-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking-api
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://booking_user:secure_password@postgres:5432/bookingdb
      - REDIS_URL=redis://:redis_password@redis:6379/0
      - DEBUG=true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - booking-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  booking-network:
    driver: bridge
