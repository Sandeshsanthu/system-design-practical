services:

  postgres-primary:
    image: postgres:15
    container_name: postgres-primary
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/primary/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./database/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - postgres-primary-data:/var/lib/postgresql/data
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d urlshortener"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - url-shortener-network

  postgres-replica:
    image: postgres:15
    container_name: postgres-replica
    user: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - ./database/replica/postgresql.conf:/etc/postgresql/postgresql.conf
      - postgres-replica-data:/var/lib/postgresql/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        
        echo '🔄 Initializing PostgreSQL Replica...'
        
        # Wait for primary to be ready
        until PGPASSWORD=password pg_isready -h postgres-primary -U admin -d postgres 2>/dev/null; do
          echo '⏳ Waiting for primary database...'
          sleep 2
        done
        echo '✅ Primary is ready'
        
        # Check if this is first run (empty data directory)
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          echo '📦 First run - performing base backup from primary...'
          
          # Clean data directory
          rm -rf "$$PGDATA"/*
          
          # Wait for replication user
          sleep 5
          
          # Perform base backup from primary
          echo '📥 Starting pg_basebackup...'
          PGPASSWORD=replicator_password pg_basebackup \
            -h postgres-primary \
            -D "$$PGDATA" \
            -U replicator \
            -v -P -R -X stream -C -S replica_slot || {
              echo '❌ Base backup failed. Retrying in 5 seconds...'
              sleep 5
              PGPASSWORD=replicator_password pg_basebackup \
                -h postgres-primary \
                -D "$$PGDATA" \
                -U replicator \
                -v -P -R -X stream -C -S replica_slot
            }
          
          echo '✅ Base backup complete'
          
          # Configure standby settings
          cat >> "$$PGDATA/postgresql.auto.conf" <<EOF
        include = '/etc/postgresql/postgresql.conf'
        primary_conninfo = 'host=postgres-primary port=5432 user=replicator password=replicator_password application_name=replica_slot'
        EOF
          
          echo '✅ Replica configuration complete'
        else
          echo '✅ Existing data found, starting in recovery mode'
        fi
        
        # Start PostgreSQL in standby mode
        echo '🚀 Starting PostgreSQL replica...'
        exec postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d urlshortener"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - url-shortener-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - url-shortener-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - url-shortener-network

  write-service:
    container_name: write-service
    image: sandeshs/url-shortener-write-service:7a1453c4e582573160f7cdde8c46e5e802189913
    ports:
      - "5001:5001"
    volumes:
      - ./config.py:/app/config.py:ro
    environment:
      PYTHONPATH: /app
      DB_PRIMARY_HOST: postgres-primary
      DB_PRIMARY_PORT: 5432
      DB_NAME: urlshortener
      DB_USER: admin
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - url-shortener-network

  redirect-service:
    container_name: redirect-service
    image: sandeshs/url-shortener-redirect-service:7a1453c4e582573160f7cdde8c46e5e802189913
    ports:
      - "5002:5002"
    volumes:
      - ./config.py:/app/config.py:ro
    environment:
      PYTHONPATH: /app
      DB_REPLICA_HOST: postgres-replica
      DB_REPLICA_PORT: 5432
      DB_NAME: urlshortener
      DB_USER: admin
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TTL: 3600
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_QUEUE: click_events
      BASE_URL: http://localhost/
    depends_on:
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - url-shortener-network

  analytics-worker-1:
    container_name: analytics-worker-1
    image: sandeshs/url-shortener-analytics-worker:7a1453c4e582573160f7cdde8c46e5e802189913
    volumes:
      - ./config.py:/app/config.py:ro
    environment:
      PYTHONPATH: /app
      DB_PRIMARY_HOST: postgres-primary
      DB_PRIMARY_PORT: 5432
      DB_NAME: urlshortener
      DB_USER: admin
      DB_PASSWORD: password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_QUEUE: click_events
      WORKER_ID: worker-1
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - url-shortener-network

  analytics-worker-2:
    container_name: analytics-worker-2
    image: sandeshs/url-shortener-analytics-worker:7a1453c4e582573160f7cdde8c46e5e802189913
    volumes:
      - ./config.py:/app/config.py:ro
    environment:
      PYTHONPATH: /app
      DB_PRIMARY_HOST: postgres-primary
      DB_PRIMARY_PORT: 5432
      DB_NAME: urlshortener
      DB_USER: admin
      DB_PASSWORD: password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_QUEUE: click_events
      WORKER_ID: worker-2
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - url-shortener-network

  nginx-cdn:
    image: sandeshs/url-shortener-nginx-cdn:01f8dd31af041809c71cf8f835c6172c05d7fd6b
    container_name: nginx-cdn
    ports:
      - "8080:8080" # FIXED: Maps host port 8080 to unprivileged container port 8080
    depends_on:
      write-service:
        condition: service_started
      redirect-service:
        condition: service_started
    networks:
      - url-shortener-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8080/nginx-health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped


volumes:
  postgres-primary-data:
  postgres-replica-data:
  redis-data:
  rabbitmq-data:

networks:
  url-shortener-network:
    driver: bridge
