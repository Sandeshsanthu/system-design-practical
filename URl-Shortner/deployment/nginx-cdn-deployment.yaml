apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-cdn
  namespace: url-shortener
  labels:
    app: nginx-cdn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-cdn
  template:
    metadata:
      labels:
        app: nginx-cdn
    spec:
      containers:
        - name: nginx-cdn
          image: sandeshs/url-shortener-nginx-cdn:831ae0dea3f937c64619dbb31e2314ab72a70d4f
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          # Enforces the unprivileged execution rules in Kubernetes
          securityContext:
            runAsUser: 101 # Default 'nginx' user UID in Alpine
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          # Replicates your Docker Compose healthcheck configuration
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-cdn
  labels:
    app: nginx-cdn
spec:
  type: ClusterIP # Use NodePort or LoadBalancer if exposing directly outside the cluster
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: nginx-cdn
