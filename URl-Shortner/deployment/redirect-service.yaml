apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: redirect-service
  namespace: url-shortener
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: redirect-service
  template:
    metadata:
      labels:
        app: redirect-service
      # FEATURE ADDITION: Annotations to let Prometheus discover your metrics endpoint
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: redirect-service
          image:  sandeshs/url-shortener-redirect-service:metrics
          ports:
            - containerPort: 5002
              name: http
          # FEATURE ADDITION: Production Resource limits to track memory/CPU saturation accurately
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          env:
            - name: PYTHONPATH
              value: "/app"
            - name: BASE_URL
              value: "http://localhost:8080/"
            - name: DB_REPLICA_HOST
              value: "postgres-read-router"
            - name: DB_REPLICA_PORT
              value: "5432"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_TTL
              value: "3600"
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: "guest"
            - name: RABBITMQ_PASSWORD
              value: "guest"
            - name: RABBITMQ_QUEUE
              value: "click_events"
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_DB }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_PASSWORD }
          volumeMounts:
            - name: app-config-volume
              mountPath: /app/config.py
              subPath: config.py
              readOnly: true
      volumes:
        - name: app-config-volume
          configMap:
            name: postgres-configs

  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
      - setWeight: 50
      - pause: { duration: 2m }
---
apiVersion: v1
kind: Service
metadata:
  name: redirect-service
  namespace: url-shortener
spec:
  type: ClusterIP
  selector:
    app: redirect-service
  ports:
    - port: 5002
      targetPort: 5002
      name: http
