apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-cdn
  namespace: url-shortener
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-cdn
  template:
    metadata:
      labels:
        app: nginx-cdn
    spec:
      containers:
        - name: nginx-cdn
          image: sandeshs/url-shortener-nginx-cdn:7a1453c4e582573160f7cdde8c46e5e802189913
          # FIXED: Pass the daemon configuration directly into the entrypoint command arguments block
          command: ["nginx"]
          args: ["-g", "daemon off;"]
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: frontend-source-volume
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: nginx-config-volume
          configMap:
            name: postgres-configs
        - name: frontend-source-volume
          hostPath:
            path: /run/desktop/mnt/host/c/Users/sandeshs/system-design-practical/URl-Shortner/frontend
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-cdn
  namespace: url-shortener
spec:
  type: NodePort
  selector:
    app: nginx-cdn
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
