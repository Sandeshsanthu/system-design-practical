# filename: db-dashboard-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-database
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  database-performance.json: |
    {
      "title": "Database Performance & Latency",
      "tags": ["database", "postgresql"],
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "type": "graph",
          "title": "Query Latency (ms)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "rate(write_service_db_query_duration_seconds_sum[1m]) / rate(write_service_db_query_duration_seconds_count[1m]) * 1000",
              "refId": "A",
              "legendFormat": "Avg Latency"
            }
          ],
          "yaxes": [
            {"format": "ms"},
            {"format": "short"}
          ]
        },
        {
          "id": 2,
          "type": "graph",
          "title": "Query Rate",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "rate(write_service_db_queries_total[1m])",
              "refId": "A",
              "legendFormat": "Queries/sec"
            }
          ],
          "yaxes": [
            {"format": "qps"},
            {"format": "short"}
          ]
        },
        {
          "id": 3,
          "type": "graph",
          "title": "Database Connections",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "write_service_db_connections_active",
              "refId": "A",
              "legendFormat": "Active"
            },
            {
              "expr": "write_service_db_connections_idle",
              "refId": "B",
              "legendFormat": "Idle"
            }
          ]
        },
        {
          "id": 4,
          "type": "graph",
          "title": "Redis Hit Rate",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "rate(redis_keyspace_hits_total[1m]) / (rate(redis_keyspace_hits_total[1m]) + rate(redis_keyspace_misses_total[1m])) * 100",
              "refId": "A",
              "legendFormat": "Hit Rate %"
            }
          ],
          "yaxes": [
            {"format": "percent", "min": 0, "max": 100},
            {"format": "short"}
          ]
        }
      ],
      "schemaVersion": 16,
      "version": 0,
      "refresh": "10s"
    }
