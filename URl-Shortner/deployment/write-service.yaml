apiVersion: argoproj.io/v1alpha1 # 1. Changed API to Argo Rollouts
kind: Rollout                    # 2. Changed Kind from Deployment to Rollout
metadata:
  name: write-service
  namespace: url-shortener
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: write-service
  template:
    metadata:
      labels:
        app: write-service
    spec:
      containers:
        - name: write-service
          image: sandeshs/url-shortener-write-service:e2977650ccbdf7d67d1a58d7e5290d152de42ed3
          ports:
            - containerPort: 5001
              name: http
          env:
            - name: PYTHONPATH
              value: "/app"
            - name: BASE_URL
              value: "http://localhost:8080/"
            - name: DB_PRIMARY_HOST
              value: "postgres-write-router"
            - name: DB_PRIMARY_PORT
              value: "5432"
            - name: DB_REPLICA_HOST
              value: "postgres-read-router"
            - name: DB_REPLICA_PORT
              value: "5432"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_TTL
              value: "3600"
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: "guest"
            - name: RABBITMQ_PASSWORD
              value: "guest"
            - name: RABBITMQ_QUEUE
              value: "click_events"
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_DB }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_PASSWORD }
          volumeMounts:
            - name: app-config-volume
              mountPath: /app/config.py
              subPath: config.py
              readOnly: true
      volumes:
        - name: app-config-volume
          configMap:
            name: postgres-configs

  # 3. Added Canary Deployment Strategy Options (Automated 2-minute window)
  strategy:
    canary:
      maxSurge: 1          # Spin up 1 new temporary pod alongside the old one
      maxUnavailable: 0    # Keep the old pod alive while checking the new one
      steps:
      - setWeight: 50      # Route traffic across both old and new versions
      - pause: { duration: 2m } # System automatically promotes to 100% after 2 mins
---
apiVersion: v1
kind: Service
metadata:
  name: write-service
  namespace: url-shortener
spec:
  type: ClusterIP
  selector:
    app: write-service
  ports:
    - port: 5001
      targetPort: 5001
