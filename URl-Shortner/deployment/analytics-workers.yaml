apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-worker
  namespace: url-shortener
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-worker
  template:
    metadata:
      labels:
        app: analytics-worker
    spec:
      # This init container guarantees the workers wait until RabbitMQ is accepting connections
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z -w 2 rabbitmq 5672; do echo "⏳ Waiting for RabbitMQ broker to spin up..."; sleep 2; done; echo "✅ RabbitMQ is ready!"']
      containers:
        - name: analytics-worker
          image: sandeshs/url-shortener-analytics-worker:743a8be7f28b6e47ff6ce98f006af7423a723869
          env:
            - name: PYTHONPATH
              value: "/app"
            - name: DB_PRIMARY_HOST
              value: "postgres-write-router"
            - name: DB_PRIMARY_PORT
              value: "5432"
            # Overrides to bypass the Kubernetes discovery string conversion bugs
            - name: REDIS_PORT
              value: "6379"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_USER
              value: "guest"
            - name: RABBITMQ_PASSWORD
              value: "guest"
            - name: RABBITMQ_QUEUE
              value: "click_events"
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_DB }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_PASSWORD }
          volumeMounts:
            - name: app-config-volume
              mountPath: /app/config.py
              subPath: config.py
              readOnly: true
      volumes:
        - name: app-config-volume
          configMap:
            name: postgres-configs
