apiVersion: argoproj.io/v1alpha1 # 1. Changed API to Argo Rollouts
kind: Rollout                    # 2. Changed Kind from Deployment to Rollout
metadata:
  name: analytics-worker
  namespace: url-shortener
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: analytics-worker
  template:
    metadata:
      labels:
        app: analytics-worker
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z -w 2 rabbitmq 5672; do echo "⏳ Waiting for RabbitMQ broker to spin up..."; sleep 2; done; echo "✅ RabbitMQ is ready!"']
      containers:
        - name: analytics-worker
          image: sandeshs/url-shortener-analytics-worker
          env:
            - name: PYTHONPATH
              value: "/app"
            - name: DB_PRIMARY_HOST
              value: "postgres-write-router"
            - name: DB_PRIMARY_PORT
              value: "5432"
            - name: REDIS_PORT
              value: "6379"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_USER
              value: "guest"
            - name: RABBITMQ_PASSWORD
              value: "guest"
            - name: RABBITMQ_QUEUE
              value: "click_events"
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_DB }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_PASSWORD }
          volumeMounts:
            - name: app-config-volume
              mountPath: /app/config.py
              subPath: config.py
              readOnly: true
      volumes:
        - name: app-config-volume
          configMap:
            name: postgres-configs

  # 3. Automated 2-minute canary window configuration for workers
  strategy:
    canary:
      steps:
      - setWeight: 50           # Replaces 1 out of 2 workers with the new code version
      - pause: { duration: 2m } # Runs mixed workers for 2 mins, then auto-promotes to 100%
