apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replica
  namespace: url-shortener
spec:
  serviceName: "postgres-replica-headless"
  replicas: 1
  selector:
    matchLabels:
      app: postgres-replica
  template:
    metadata:
      labels:
        app: postgres-replica
    spec:
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
      initContainers:
        - name: fix-pgdata-permissions
          image: postgres:15
          # FIXED: Switched to root so chown/chmod actually work on the persistent volume
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              mkdir -p /var/lib/postgresql/data/pgdata
              chown -R 999:999 /var/lib/postgresql/data
              chmod 700 /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-replica-data
              mountPath: /var/lib/postgresql/data
      securityContext:
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: postgres-replica
          image: postgres:15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          envFrom:
            - secretRef:
                name: postgres-secrets
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_PASSWORD }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: config-files
              mountPath: /etc/postgresql/postgresql.conf
              subPath: replica-postgresql.conf
            - name: postgres-replica-data
              mountPath: /var/lib/postgresql/data
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo '🔄 Initializing PostgreSQL Replica...'
              
              until PGPASSWORD=password pg_isready -h postgres-primary-headless -U admin -d postgres 2>/dev/null; do
                echo '⏳ Waiting for primary database...'
                sleep 2
              done
              echo '✅ Primary is ready'
              
              if [ ! -s "$PGDATA/PG_VERSION" ]; then
                echo '📦 First run - performing base backup from primary...'
                rm -rf "$PGDATA"/*
                sleep 5
                
                echo '📥 Starting pg_basebackup...'
                PGPASSWORD=replicator_password pg_basebackup \
                  -h postgres-primary-headless \
                  -D "$PGDATA" \
                  -U replicator \
                  -v -P -R -X stream -S replica_slot || {
                    echo '❌ Base backup failed. Retrying in 5 seconds...'
                    sleep 5
                    PGPASSWORD=replicator_password pg_basebackup \
                      -h postgres-primary-headless \
                      -D "$PGDATA" \
                      -U replicator \
                      -v -P -R -X stream -S replica_slot
                  }
                
                echo '✅ Base backup complete'
                
                cat >> "$PGDATA/postgresql.auto.conf" <<EOF
              include = '/etc/postgresql/postgresql.conf'
              primary_conninfo = 'host=postgres-primary-headless port=5432 user=replicator password=replicator_password application_name=replica_slot'
              EOF
                echo '✅ Replica configuration complete'
              else
                echo '✅ Existing data found, starting in recovery mode'
              fi
              
              # FIXED: Explicitly force correct folder permissions directly before starting engine
              echo '🔒 Setting strict data directory permissions...'
              chmod 700 "$PGDATA"

              echo '🚀 Starting PostgreSQL replica...'
              exec postgres -c config_file=/etc/postgresql/postgresql.conf
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -p 5432 -U admin -d postgres
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: config-files
          configMap:
            name: postgres-configs
  volumeClaimTemplates:
    - metadata:
        name: postgres-replica-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
#        accessModes:
#        - ReadWriteOnce
#        storageClassName: eks-auto-ebs
        resources:
          requests:
            storage: 10Gi
