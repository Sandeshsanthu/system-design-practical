    server {
        listen 8080;
        server_name localhost;

        # CRITICAL FIX 1: Tell Nginx to use the Kubernetes CoreDNS engine
        # 10.96.0.10 is the standard default cluster IP for kube-dns
        resolver 10.96.0.10 valid=5s;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # CDN-like caching headers for static files
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header CDN-Cache-Status "HIT";
            expires 1y;
        }

        # Serve frontend
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # API endpoints - Write service
        location /api/shorten {
            limit_req zone=api_limit burst=5 nodelay;

            # CRITICAL FIX 2: Added a trailing slash to normalize payload pass-through
            proxy_pass http://write_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;

            # CORS headers
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
            add_header Access-Control-Allow-Headers 'Content-Type';
        }

        # FIX 3: Safe tracking regex evaluation for vanity short URLs
        location ~ "^/([a-zA-Z0-9]{1,10})$" {
            limit_req zone=redirect_limit burst=10 nodelay;

            # Pass the clean tracking URI parameter explicitly
            proxy_pass http://redirect_service/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # FIX 4: Aligned downstream routing mapping
        location /analytics/ {
            limit_req zone=api_limit burst=5 nodelay;

            proxy_pass http://redirect_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # CORS headers
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        }

        # Health check
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
